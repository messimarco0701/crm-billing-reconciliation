# Business rules used by the reconciliation.
# They live here and not in the code because they are the part that changes
# most often, and the people who own them are usually not the ones writing SQL.

# Stage that means "the customer signed"
won_stage: Closed Won

# CRM amount and billed annual fee can differ by this share before we raise a flag.
# A bit of slack avoids noise from rounding and VAT inclusive/exclusive typos.
amount_tolerance_pct: 0.02

# Contracts below this annual fee should not exist: the commercial policy
# says they must be billed at least this much.
minimum_annual_fee: 1200

# Deals without a VAT number are matched on company name.
# Score is rapidfuzz token_sort_ratio on the normalized name (0 to 100).
fuzzy_match_threshold: 90

# Naming convention for deals: COMPANY | PRODUCT | YEAR
# \p{Lu} means any upper case letter, accented ones included (FOÀ, BOLDÙ).
deal_name_pattern: '^[\p{Lu}0-9][\p{Lu}0-9 &.''-]* \| (FLEX|CORE|PREMIUM) \| 20[0-9]{2}$'
